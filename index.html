<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <title>Conversor</title>
    <link rel="stylesheet" href="./style.css">
    
</head>

<body>

    <header id="logo">
        <img src="./assets/logo.gif">
    </header>

    <main>

        <section>
            <p id="converter">Converter de </p>
            <select id="opcaoum">
                <option value="Real" id="real">Real</option>
                <option value="dolar" id="dolar">Dolar</option>
                <option value="libra" id="libra">Libra</option>
            </select>

            <p id="convertido">Converter para</p>
            <select id="opcaodois">
                <option value="dolar" id="dolar">Dólar</option>
                <option value="Real" id="real">Real</option>
                <option value="libra" id="libra">Libra</option>
            </select>

            <label>
                <input id="input-currency"  type="number" placeholder="Valor:">
            </label>
            <button class="convert-button">Converter</button>

            <div id="resultado-area">
                <section>
                    <img src="./assets/bandeirabrasil.png" >
                    <p>Real</p>
                    <p id="currencytoConverter">R$0,00</p>
                </section>

                <img src="./assets/Seta.jpg">

                <section>
                    <img src="./assets/EUA.webp">
                    <p>Dólar americano</p>
                    <p id="currencyConverted">R$0,00</p>
                </section>
            </div>

        </section>

    </main>

<script src="script.js"> </script>

</body>

</html>
